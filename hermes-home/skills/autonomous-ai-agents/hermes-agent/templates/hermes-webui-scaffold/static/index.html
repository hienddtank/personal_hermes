<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Hermes</h1>
      <div id="status"></div>
      <label for="file-input" title="Upload file">📎</label>
      <input type="file" id="file-input" style="display:none">
    </header>
    <main id="messages"></main>
    <footer>
      <textarea id="prompt" placeholder="Message Hermes…" rows="1" autofocus></textarea>
      <button id="send">↑</button>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
